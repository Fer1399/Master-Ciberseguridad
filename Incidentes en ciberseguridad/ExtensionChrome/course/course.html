<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberCoach · Formación</title>
  <link rel="icon" href="../assets/icons/icon32.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="course.css">
</head>
<body>
  <div class="layout">
    <aside class="side">
      <a class="brand" href="#">
        <img src="../assets/icons/icon48.png" alt="" width="32" height="32">
        <span>CyberCoach</span>
      </a>
      <div class="me card">
        <div class="me-row">
          <span id="level-icon" class="level-icon">🌱</span>
          <div class="grow">
            <strong id="level-name">Novato</strong>
            <div class="muted small"><span id="points">0</span> puntos</div>
          </div>
        </div>
        <div class="bar"><div id="level-bar" class="bar-fill"></div></div>
      </div>
      <nav>
        <ul id="nav" class="nav"></ul>
      </nav>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="../shared/storage.js"></script>
  <script src="course.js"></script>
</body>
</html>
